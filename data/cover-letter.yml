salutation: Dear Scribd Team,

body:
  - Thank you for reviewing my application. I am very eager to present the skills and qualifications that I believe match this listing for a Front-end Engineer. I want to keep it simple and say I have previously used Scribd to read books and documents for topics I am interested in. I enjoyed the experience and found it a unique product offering. I would love to talk more about Scribd's mission and if I align with that. Thanks and have a great day! 